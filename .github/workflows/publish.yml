name: publish

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "themes/**"
      - "mcp/**"
      - "plugins/**"
      - "schemas/**"
      - "scripts/**"
      - "index.json"
      - "revoked.json"
      - "registry.pub"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registry-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Only the bytes a reviewer approved are signed: the index is rebuilt here
      # and a stale one fails instead of being replaced with something nobody read.
      - name: Rebuild the index and require it matches the merged bytes
        run: |
          node scripts/build-index.mjs --check
          node scripts/validate-schemas.mjs

      - name: Install minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends minisign
          minisign -v

      - name: Sign index.json
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/registry.key"
          umask 077
          trap 'rm -f "$key"' EXIT
          # A secret pasted from Windows can carry CRLF; minisign reads the key as text.
          printf '%s\n' "$MINISIGN_PRIVATE_KEY" | tr -d '\r' > "$key"
          printf '%s\n' "${MINISIGN_PASSWORD%$'\r'}" | minisign -S -s "$key" \
            -m index.json -x index.json.minisig \
            -t "reasonix-registry $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          minisign -Vm index.json -p registry.pub

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="registry-$(date -u +%Y%m%dT%H%M%SZ)"
          sha256sum index.json
          gh release create "$tag" index.json index.json.minisig \
            --title "Registry ${tag#registry-}" \
            --notes "Signed registry index for $(git rev-parse --short HEAD)." \
            --target "$GITHUB_SHA" \
            --latest
