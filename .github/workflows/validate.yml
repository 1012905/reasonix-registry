name: validate

on:
  pull_request:
    paths:
      - "skills/**"
      - "themes/**"
      - "mcp/**"
      - "plugins/**"
      - "schemas/**"
      - "scripts/**"
      - "index.json"
      - "revoked.json"
      - ".github/workflows/validate.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: index.json is current
        run: node scripts/build-index.mjs --check

      - name: Manifests and index match schemas
        run: node scripts/validate-schemas.mjs

      - name: Entries stay inside their size caps
        run: node scripts/build-index.mjs --caps

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
